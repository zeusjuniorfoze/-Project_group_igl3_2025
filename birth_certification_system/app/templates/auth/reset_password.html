<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6848">
    <title>Nouveau mot de passe | Actes de naissance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='boxicons/css/boxicons.min.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <a class="auth-brand" href="{{ url_for('main.index') }}">
            <span class="auth-brand-mark"><i class="bx bxs-baby-carriage"></i></span>
            <span>État civil <strong>Numérique</strong></span>
        </a>

        <section class="auth-card" aria-labelledby="auth-title">
            <a class="auth-back" href="{{ url_for('auth.forget_password') }}">
                <i class="bx bx-arrow-back"></i> Recommencer la procédure
            </a>
            <div class="auth-icon"><i class="bx bx-lock-alt"></i></div>
            <p class="auth-eyebrow">Dernière étape</p>
            <h1 id="auth-title">Choisissez un nouveau mot de passe</h1>
            <p class="auth-description">
                Utilisez au moins 12 caractères et confirmez votre nouveau mot de passe.
            </p>

            {% include "auth/_messages.html" %}

            <form action="{{ url_for('auth.reset_password') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="auth-label" for="password">Nouveau mot de passe</label>
                <div class="auth-input-wrap">
                    <i class="bx bx-lock-alt" aria-hidden="true"></i>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="12 caractères minimum"
                        minlength="12"
                        autocomplete="new-password"
                        required
                    >
                    <button class="auth-password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
                        <i class="bx bx-show" aria-hidden="true"></i>
                    </button>
                </div>

                <label class="auth-label" for="confirm_password">Confirmer le mot de passe</label>
                <div class="auth-input-wrap">
                    <i class="bx bx-lock-alt" aria-hidden="true"></i>
                    <input
                        type="password"
                        name="confirm_password"
                        id="confirm_password"
                        placeholder="Répétez le nouveau mot de passe"
                        minlength="12"
                        autocomplete="new-password"
                        required
                    >
                    <button class="auth-password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
                        <i class="bx bx-show" aria-hidden="true"></i>
                    </button>
                </div>
                <button class="auth-button" type="submit">
                    Mettre à jour le mot de passe <i class="bx bx-check"></i>
                </button>
            </form>
        </section>

        <p class="auth-copyright">République du Cameroun · Paix – Travail – Patrie</p>
    </main>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        document.querySelectorAll(".auth-password-toggle").forEach((button) => {
            button.addEventListener("click", () => {
                const input = button.parentElement.querySelector("input");
                const visible = input.type === "password";
                input.type = visible ? "text" : "password";
                button.setAttribute("aria-pressed", String(visible));
                button.setAttribute(
                    "aria-label",
                    visible ? "Masquer le mot de passe" : "Afficher le mot de passe"
                );
                button.querySelector("i").className = visible ? "bx bx-hide" : "bx bx-show";
            });
        });

        const resetForm = document.querySelector("form");
        const passwordInput = document.getElementById("password");
        const confirmationInput = document.getElementById("confirm_password");
        const validatePasswordMatch = () => {
            confirmationInput.setCustomValidity(
                confirmationInput.value && confirmationInput.value !== passwordInput.value
                    ? "Les mots de passe ne correspondent pas."
                    : ""
            );
        };
        passwordInput.addEventListener("input", validatePasswordMatch);
        confirmationInput.addEventListener("input", validatePasswordMatch);
        resetForm.addEventListener("submit", validatePasswordMatch);
    </script>
</body>
</html>
