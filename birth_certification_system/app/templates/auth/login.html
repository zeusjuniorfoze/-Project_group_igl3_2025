<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6848">
    <title>Connexion | Actes de naissance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='boxicons/css/boxicons.min.css') }}">
</head>
<body class="auth-body">
    <main class="auth-shell">
        <a class="auth-brand" href="{{ url_for('main.index') }}">
            <span class="auth-brand-mark"><i class="bx bxs-baby-carriage"></i></span>
            <span>État civil <strong>Numérique</strong></span>
        </a>

        <section class="auth-card" aria-labelledby="auth-title">
            <a class="auth-close" href="{{ url_for('main.index') }}" aria-label="Retour à l’accueil" title="Retour à l’accueil">
                <i class="bx bx-x" aria-hidden="true"></i>
            </a>
            <div class="auth-icon"><i class="bx bx-user"></i></div>
            <p class="auth-eyebrow">Espace sécurisé</p>
            <h1 id="auth-title">Connexion</h1>
            <p class="auth-description">Connectez-vous à votre espace de gestion de l’état civil.</p>

            {% include "auth/_messages.html" %}

            <form action="{{ url_for('auth.login_post') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="auth-label" for="email">Adresse e-mail</label>
                <div class="auth-input-wrap">
                    <i class="bx bx-envelope" aria-hidden="true"></i>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="exemple@domaine.com"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <label class="auth-label" for="mot_de_passe">Mot de passe</label>
                <div class="auth-input-wrap">
                    <i class="bx bx-lock-alt" aria-hidden="true"></i>
                    <input
                        type="password"
                        name="mot_de_passe"
                        id="mot_de_passe"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >
                    <button class="auth-password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false">
                        <i class="bx bx-show" aria-hidden="true"></i>
                    </button>
                </div>

                <div class="auth-options">
                    <a href="{{ url_for('auth.forget_password') }}">Mot de passe oublié ?</a>
                </div>
                <button class="auth-button" type="submit">
                    Se connecter <i class="bx bx-right-arrow-alt"></i>
                </button>
            </form>
        </section>

        <p class="auth-copyright">République du Cameroun · Paix – Travail – Patrie</p>
    </main>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        document.querySelectorAll(".auth-password-toggle").forEach((button) => {
            button.addEventListener("click", () => {
                const input = button.parentElement.querySelector("input");
                const visible = input.type === "password";
                input.type = visible ? "text" : "password";
                button.setAttribute("aria-pressed", String(visible));
                button.setAttribute(
                    "aria-label",
                    visible ? "Masquer le mot de passe" : "Afficher le mot de passe"
                );
                button.querySelector("i").className = visible ? "bx bx-hide" : "bx bx-show";
            });
        });
    </script>
</body>
</html>
